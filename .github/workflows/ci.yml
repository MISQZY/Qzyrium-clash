name: CI

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NODE_VERSION: '22'

jobs:
  checks:
    name: Typecheck and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Static checks do not need Electron binaries or native dependency builds.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint

  functional:
    name: Functional and Electron UI checks
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Configure desktop for native window checks
        shell: powershell
        run: ./scripts/fixtures/configure-ci-display.ps1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm prepare:resources
      - run: node scripts/verify-release.cjs resources
      - run: pnpm build
        id: build
      - name: Select a graphics backend that passes native presentation checks
        id: native
        run: node scripts/check-ci-graphics.cjs
      - run: pnpm test:bundle
      - run: pnpm test:functional
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.native.outcome == 'success' }}
      - run: pnpm test:ui:all
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.native.outcome == 'success' }}
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_id }}
          path: artifacts/test-results/**/report.json
          if-no-files-found: ignore
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-failure-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  release-windows:
    name: Build Windows release
    needs: [checks, functional]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Verify tag matches the application version
        run: node scripts/verify-release.cjs version
      - name: Download Mihomo and geodata
        run: pnpm prepare:resources
      - name: Verify bundled runtime resources
        run: node scripts/verify-release.cjs resources
      - name: Build NSIS installer and portable executable
        run: pnpm build:win
      - name: Verify release assets
        run: node scripts/verify-release.cjs assets
      - name: Verify packaged startup, portable and installer payload
        run: pnpm test:packaged:runtime
      - name: Upload packaged runtime diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-runtime-failure-${{ github.run_id }}
          path: |
            artifacts/test-results/packaged-runtime/**
            artifacts/packaged-ui/**/report.json
            artifacts/packaged-ui/**/isolation.json
          if-no-files-found: ignore
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  release-linux:
    name: Build Linux releases (AppImage, deb, rpm, tar.gz)
    needs: [checks, functional]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies for Linux packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Verify tag matches the application version
        run: node scripts/verify-release.cjs version
      - name: Download Mihomo and geodata
        run: pnpm prepare:resources
      - name: Verify bundled runtime resources
        run: node scripts/verify-release.cjs resources
      - name: Build Linux packages
        run: pnpm build:linux
      - name: Verify release assets
        run: node scripts/verify-release.cjs assets
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          if-no-files-found: warn
          compression-level: 0
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/latest-linux.yml

  publish:
    name: Publish GitHub Release
    needs: [release-windows, release-linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        run: |
          release_files=()
          for f in release-assets/*; do
            [ -f "$f" ] && release_files+=("$f")
          done
          gh release create "$RELEASE_TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes
