appId: com.qzyrium.vpn
productName: 'Qzyrium - clash'
publish:
  provider: github
  owner: MISQZY
  repo: Qzyrium-clash
  releaseType: release
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/**'
electronLanguages:
  - 'en'
  - 'ru'
extraResources:
  - from: LICENSE
    to: licenses/GPL-3.0.txt
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: resources/licenses/
    to: licenses/
  - from: './extra/'
    to: ''
protocols:
  name: 'Qzyrium - clash URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
    - 'qzyrium'
win:
  icon: resources/icon.ico
  requestedExecutionLevel: asInvoker
  target:
    - nsis
    - portable
  artifactName: Qzyrium-clash_${version}_${arch}.${ext}
nsis:
  artifactName: Qzyrium-clash_${version}_${arch}_setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
