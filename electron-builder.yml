appId: com.qzyrium.vpn
productName: 'Qzyrium-clash'
executableName: 'Qzyrium-clash'
publish:
  provider: github
  owner: MISQZY
  repo: Qzyrium-clash
  releaseType: release
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/**'
electronLanguages:
  - 'en'
  - 'ru'
extraResources:
  - from: resources/linux-core-supervisor.cjs
    to: files/linux-core-supervisor.cjs
  - from: resources/linux-proxy-watchdog.cjs
    to: files/linux-proxy-watchdog.cjs
  - from: resources/linux-proxy-recovery.cjs
    to: files/linux-proxy-recovery.cjs
  - from: LICENSE
    to: licenses/GPL-3.0.txt
  - from: resources/licenses/
    to: licenses/
  - from: './extra/'
    to: ''
protocols:
  name: 'Qzyrium-clash URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
    - 'qzyrium'
win:
  icon: resources/icon.ico
  executableName: Qzyrium-clash
  requestedExecutionLevel: asInvoker
  target:
    - nsis
    - portable
  artifactName: Qzyrium-clash_${version}_${arch}.${ext}
nsis:
  shortcutName: Qzyrium Clash
  artifactName: Qzyrium-clash_${version}_${arch}_setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  include: build/nsis/installer.nsh
linux:
  icon: resources/icon.png
  category: Network
  executableName: Qzyrium-clash
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  artifactName: Qzyrium-clash_${version}_${arch}.${ext}
  synopsis: Qzyrium Clash VPN Client
  description: Fast and secure proxy/VPN client powered by Mihomo
deb:
  depends:
    - libnotify4
    - libxtst6
    - libnss3
    - libayatana-appindicator3-1
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
rpm:
  depends:
    - libnotify
    - libXtst
    - nss
    - libayatana-appindicator-gtk3
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
